name: release

on:
  push:
    tags: ['[0-9]*']

env:
  OCI_REPO: ghcr.io/${{ github.repository }}
  OCI_CHART_REPO: ghcr.io/${{ github.repository }}-chart

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check versions match
        run: |
          cargo_version=$(yq -r '.package.version' Cargo.toml)
          chart_version=$(yq -r '.version' charts/firebird_exporter/Chart.yaml)
          app_version=$(yq -r '.appVersion' charts/firebird_exporter/Chart.yaml)

          if [[ "$cargo_version" != "$chart_version" ]] || [[ "$cargo_version" != "$app_version" ]]; then
            echo "ERROR: Version mismatch!"
            echo "Cargo.toml version: $cargo_version"
            echo "Chart.yaml version: $chart_version"
            echo "Chart.yaml appVersion: $app_version"
            exit 1
          fi

  build-release:
    needs: check-version
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-26.04
            platform: linux/amd64
          - runs-on: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    steps:

    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4

    - name: log into ghcr
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ matrix.platform }}
        provenance: false
        push: true
        outputs: type=image,name=${{ env.OCI_REPO }},push-by-digest=true,name-canonical=true

    - name: export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-manifests:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: log into ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.OCI_REPO }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.OCI_REPO }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: inspect image
        run: docker buildx imagetools inspect ${{ env.OCI_REPO }}:${{ steps.meta.outputs.version }}

  publish-chart:
    needs: merge-manifests
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: set up helm
        uses: azure/setup-helm@v5

      - name: log into ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: lint chart
        run: helm lint charts/firebird_exporter/

      - name: package and push chart
        run: |
          chart_version=$(yq -r '.version' charts/firebird_exporter/Chart.yaml)
          helm package charts/firebird_exporter/
          helm push firebird_exporter-${chart_version}.tgz oci://${{ env.OCI_CHART_REPO }}

  create-release:
    needs: merge-manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          prerelease: false
